<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tackboard - live project board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--paper:#EDF1F5;--ink:#16233A;--mute:#5B6B82;--line:#CBD5E1;--card:#fff;--accent:#2C56E8;--todo:#6B7A90;--doing:#C9861A;--done:#2E8B6A}
@media (prefers-color-scheme:dark){:root{--paper:#0F1726;--ink:#E6ECF5;--mute:#93A3BA;--line:#25324A;--card:#18233A}}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.45 "IBM Plex Sans",system-ui,sans-serif}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding:14px 20px;border-bottom:1px solid var(--line)}
h1{font-size:18px;margin:0;font-weight:600}
.bar{display:flex;gap:12px;align-items:center}
.pill{font-size:13px;color:var(--mute);display:flex;gap:6px;align-items:center}
.dot{width:8px;height:8px;border-radius:50%;background:var(--mute)}
.live .dot{background:var(--done)}.offline .dot{background:#C9461A}
.who{display:flex}
.who span{width:26px;height:26px;border-radius:50%;color:#fff;font-size:12px;font-weight:600;display:grid;place-items:center;margin-left:-6px;border:2px solid var(--paper)}
button{font:inherit;cursor:pointer}
.btn{background:var(--accent);color:#fff;border:0;border-radius:6px;padding:6px 12px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
main{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;padding:20px;align-items:start}
@media (max-width:820px){main{grid-template-columns:1fr}}
.lane{background:color-mix(in srgb,var(--card) 55%,transparent);border-top:3px solid var(--c);border-radius:6px;padding:10px;min-height:160px}
.lane.over{outline:2px dashed var(--accent)}
.lane h2{font-size:14px;margin:2px 4px 10px;display:flex;justify-content:space-between;font-weight:600}
.lane h2 small{color:var(--mute);font-weight:400}
.cards{display:flex;flex-direction:column;gap:8px;min-height:24px}
.cards:empty::before{content:"Nothing here yet";color:var(--mute);font-size:13px;padding:4px}
.card{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:8px 10px;display:flex;gap:8px;justify-content:space-between;cursor:grab}
.card.dragging{opacity:.4}
.card.syncing{border-style:dashed;border-color:var(--accent)}
.title{margin:0;overflow-wrap:anywhere;flex:1}
.title[contenteditable]{outline:2px solid var(--accent);border-radius:3px}
.x{background:none;border:0;color:var(--mute);font-size:18px;line-height:1;padding:0 2px}
.x:hover{color:#C9461A}
.add{width:100%;margin-top:10px;padding:8px;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--ink);font:inherit}
.toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:8px 14px;border-radius:6px;font-size:13px}
.toast[hidden]{display:none}
</style>
</head>
<body>
<header>
  <h1 id="bname">Tackboard</h1>
  <div class="bar">
    <div class="who" id="who" aria-label="People on this board"></div>
    <div class="pill" id="status"><i class="dot"></i><span>Connecting</span></div>
    <button class="btn" id="share">Copy board link</button>
  </div>
</header>
<main id="lanes"></main>
<div class="toast" id="toast" role="status" hidden></div>
<script>
'use strict';
const LANES = [['todo', 'To do', 'var(--todo)'], ['doing', 'In progress', 'var(--doing)'], ['done', 'Done', 'var(--done)']];
const $ = (s) => document.querySelector(s);
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : Math.random().toString(36).slice(2) + Date.now()).replace(/[^\w-]/g, '').slice(0, 24);

const board = () => window.__TB_BOARD__ || 'main';
if (!location.hash) history.replaceState(null, '', '#' + board);
$('#bname').textContent = 'Tackboard';
let myName = localStorage.getItem('tb-name') || prompt('Choose your display name')?.trim() || 'Guest';
let authToken = localStorage.getItem('tb-token') || '';
localStorage.setItem('tb-name', myName);
try {
  myName = localStorage.getItem('tb-name') || ['Otter', 'Heron', 'Lynx', 'Finch', 'Ibex', 'Marten'][Math.floor(Math.random() * 6)] + '-' + Math.floor(Math.random() * 90 + 10);
  localStorage.setItem('tb-name', myName);
} catch {}

// ---- state: authoritative copy + pending (unacked) ops; the view = server + pending replayed ----
const server = { cards: new Map(), v: 0 };
let pending = [], users = [], me = null, ws, retry = 0, editing = false, dragging = false, dirty = false;

function applyOp(map, op) {
  const c = map.get(op.id);
  if (op.type === 'card.create') { if (!c) map.set(op.id, { id: op.id, col: op.col, title: op.title, pos: op.pos }); }
  else if (op.type === 'card.update') { if (c) map.set(op.id, { ...c, title: op.title }); }
  else if (op.type === 'card.move') { if (c) map.set(op.id, { ...c, col: op.col, pos: op.pos }); }
  else if (op.type === 'card.delete') map.delete(op.id);
}
function view() { const m = new Map(server.cards); pending.forEach((p) => applyOp(m, p.op)); return m; }

function send(op) { // optimistic: show now, confirm later
  const p = { opId: uid(), op };
  pending.push(p);
  render();
  if (ws && ws.readyState === 1) ws.send(JSON.stringify({ t: 'op', opId: p.opId, op }));
}

// ---- network ----
function setStatus(kind) {
  const el = $('#status');
  el.className = 'pill ' + kind;
  const n = pending.length;
  el.lastChild.textContent = kind === 'live' ? (n ? `Saving ${n}...` : 'Live') : kind === 'offline' ? `Offline${n ? ` - ${n} change${n > 1 ? 's' : ''} waiting` : ''}` : 'Connecting';
}
function connect() {
  setStatus('connecting');
  ws = new WebSocket(`${location.protocol === 'https:' ? 'wss' : 'ws'}://${location.host}/ws?board=${encodeURIComponent(board())}&token=${encodeURIComponent(authToken)}`);
  ws.onmessage = (e) => onMsg(JSON.parse(e.data));
  ws.onclose = () => { setStatus('offline'); setTimeout(connect, Math.min(10000, 500 * 2 ** retry++) + Math.random() * 300); };
}
function onMsg(m) {
  if (m.t === 'snapshot') {
    retry = 0; me = m.you; users = m.users;
    server.cards = new Map(m.cards.map((c) => [c.id, c])); server.v = m.v;
    pending.forEach((p) => ws.send(JSON.stringify({ t: 'op', opId: p.opId, op: p.op }))); // resend; server dedupes by opId
  } else if (m.t === 'op') { applyOp(server.cards, m.op); server.v = m.v; }
  else if (m.t === 'ack') {
    const i = pending.findIndex((p) => p.opId === m.opId);
    if (i >= 0) { applyOp(server.cards, pending[i].op); pending.splice(i, 1); }
    server.v = Math.max(server.v, m.v);
  } else if (m.t === 'nack') {
    pending = pending.filter((p) => p.opId !== m.opId);
    toast('Change rejected: ' + m.error);
  } else if (m.t === 'presence') users = m.users;
  setStatus('live'); render(); renderWho();
}

// ---- rendering ----
function build() {
  $('#lanes').replaceChildren(...LANES.map(([id, label, color]) => {
    const lane = document.createElement('section');
    lane.className = 'lane'; lane.id = 'lane-' + id; lane.style.setProperty('--c', color);
    lane.innerHTML = `<h2>${label}<small></small></h2><div class="cards"></div><input class="add" maxlength="200" placeholder="Add a card" aria-label="Add a card to ${label}">`;
    const body = lane.querySelector('.cards');
    lane.ondragover = (e) => { e.preventDefault(); lane.classList.add('over'); };
    lane.ondragleave = (e) => { if (!lane.contains(e.relatedTarget)) lane.classList.remove('over'); };
    lane.ondrop = (e) => {
      e.preventDefault(); lane.classList.remove('over'); dragging = false;
      const id = e.dataTransfer.getData('text/plain'), m = view();
      if (!m.has(id)) return render();
      const els = [...body.querySelectorAll('.card:not(.dragging)')];
      const others = els.map((el) => m.get(el.dataset.id)).filter(Boolean);
      let i = els.findIndex((el) => e.clientY < el.getBoundingClientRect().top + el.offsetHeight / 2);
      if (i < 0) i = others.length;
      const prev = others[i - 1]?.pos, next = others[i]?.pos;
      const pos = prev == null && next == null ? 1 : prev == null ? next - 1 : next == null ? prev + 1 : (prev + next) / 2; // fractional index
      send({ type: 'card.move', id, col: id_of(lane), pos });
    };
    lane.querySelector('.add').onkeydown = (e) => {
      const t = e.target.value.trim();
      if (e.key !== 'Enter' || !t) return;
      const max = Math.max(0, ...[...view().values()].filter((c) => c.col === id).map((c) => c.pos));
      send({ type: 'card.create', id: uid(), col: id, title: t.slice(0, 200), pos: max + 1 });
      e.target.value = '';
    };
    return lane;
  }));
}
const id_of = (lane) => lane.id.slice(5);

function cardEl(c, syncing) {
  const el = document.createElement('article');
  el.className = 'card' + (syncing ? ' syncing' : ''); el.draggable = true; el.dataset.id = c.id;
  const t = document.createElement('p'); t.className = 'title'; t.textContent = c.title; t.tabIndex = 0;
  const start = () => edit(t, c);
  t.ondblclick = start; t.onkeydown = (e) => e.key === 'Enter' && start();
  const x = document.createElement('button'); x.className = 'x'; x.textContent = '\u00d7'; x.setAttribute('aria-label', 'Delete card ' + c.title);
  x.onclick = () => send({ type: 'card.delete', id: c.id });
  el.ondragstart = (e) => { dragging = true; e.dataTransfer.setData('text/plain', c.id); e.dataTransfer.effectAllowed = 'move'; el.classList.add('dragging'); };
  el.append(t, x);
  return el;
}
function edit(t, c) {
  editing = true;
  try { t.contentEditable = 'plaintext-only'; } catch { t.contentEditable = 'true'; }
  t.focus();
  const done = (save) => {
    t.onblur = null; t.contentEditable = 'false'; t.removeAttribute('contenteditable'); editing = false;
    const v = t.textContent.trim().slice(0, 200);
    t.onkeydown = (e) => e.key === 'Enter' && edit(t, c);
    if (save && v && v !== c.title) send({ type: 'card.update', id: c.id, title: v });
    else { t.textContent = c.title; if (dirty) render(); }
  };
  t.onblur = () => done(true);
  t.onkeydown = (e) => {
    if (e.key === 'Enter') { e.preventDefault(); t.blur(); }
    if (e.key === 'Escape') { t.onblur = null; done(false); }
  };
}
function render() {
  if (editing || dragging) { dirty = true; return setStatus(ws && ws.readyState === 1 ? 'live' : 'offline'); }
  dirty = false;
  const m = view(), touched = new Set(pending.map((p) => p.op.id));
  for (const [id] of LANES) {
    const cs = [...m.values()].filter((c) => c.col === id).sort((a, b) => a.pos - b.pos || a.id.localeCompare(b.id));
    const lane = $('#lane-' + id);
    lane.querySelector('.cards').replaceChildren(...cs.map((c) => cardEl(c, touched.has(c.id))));
    lane.querySelector('small').textContent = cs.length;
  }
  setStatus(ws && ws.readyState === 1 ? 'live' : 'offline');
}
function renderWho() {
  $('#who').replaceChildren(...users.map((u) => {
    const s = document.createElement('span');
    s.style.background = u.color; s.textContent = u.name.slice(0, 2).toUpperCase();
    s.title = u.name + (u.id === me ? ' (you)' : ''); return s;
  }));
}
let tt; function toast(msg) { const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(tt); tt = setTimeout(() => (t.hidden = true), 3500); }

document.addEventListener('dragend', () => { dragging = false; document.querySelectorAll('.lane.over').forEach((l) => l.classList.remove('over')); if (dirty) render(); });
$('#share').onclick = async () => { try { await navigator.clipboard.writeText(location.href); toast('Board link copied'); } catch { toast(location.href); } };
async function boot() {
  if (!authToken) {
    const r = await fetch('/api/auth', { method:'POST', headers:{'content-type':'application/json'}, body:JSON.stringify({name:myName}) });
    if (!r.ok) throw new Error('Authentication failed');
    const d = await r.json(); authToken = d.token; localStorage.setItem('tb-token', authToken);
  }
  let raw = location.hash.slice(1) || '';
  let [boardId, query] = raw.split('?');
  boardId = (boardId || '').replace(/[^\\w-]/g,'').slice(0,40);
  const shareKey = new URLSearchParams(query || '').get('key') || '';
  if (!boardId) {
    const r = await fetch('/api/boards', {headers:{'x-auth-token':authToken}});
    const boards = await r.json();
    if (boards[0]) boardId = boards[0].id;
    else {
      const cr = await fetch('/api/boards', {method:'POST',headers:{'content-type':'application/json','x-auth-token':authToken},body:JSON.stringify({name:'My Team Board'})});
      const d = await cr.json(); boardId = d.board.id;
      history.replaceState(null,'','#'+boardId+'?key='+encodeURIComponent(d.shareToken));
      return location.reload();
    }
  }
  if (shareKey) {
    const jr = await fetch('/api/boards/'+boardId+'/join?key='+encodeURIComponent(shareKey),{method:'POST',headers:{'x-auth-token':authToken}});
    if (!jr.ok) throw new Error('Invalid board share link');
    history.replaceState(null,'','#'+boardId);
  }
  window.__TB_BOARD__ = boardId;
  build(); connect();
}
boot().catch(e => toast(e.message));
</script>
</body>
</html>
